<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="BRACU Course Tracker is temporarily undergoing maintenance."
    />
    <title>Maintenance · BRACU Course Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Space+Grotesk:wght@600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/maintenance-preview.css" />
    <link rel="stylesheet" href="css/maintenance.css" />
    <link rel="stylesheet" href="css/support.css" />
  </head>
  <body class="maintenance-page maintenance-production">
    <canvas
      id="dotGridBackground"
      class="dot-grid-background"
      aria-hidden="true"
    ></canvas>
    <header class="maintenance-header">
      <a
        class="maintenance-brand"
        href="maintenance.html"
        aria-label="BRACU Course Tracker maintenance page"
      >
        <span class="maintenance-brand-mark" aria-hidden="true">CS</span
        ><strong>BRACU Course Tracker</strong>
      </a>
      <nav class="maintenance-nav" aria-label="Maintenance page actions">
        <button
          class="maintenance-action maintenance-support-link"
          type="button"
          data-open-support
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 5.5h16v11H8l-4 3v-14Z" />
            <path d="M8 9h8M8 12.5h5" /></svg
          ><span>Support</span>
        </button>
        <a
          class="maintenance-action maintenance-admin-link"
          href="auth.html?mode=admin"
          ><svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 3.5 19 6v5.2c0 4.4-2.8 7.7-7 9.3-4.2-1.6-7-4.9-7-9.3V6l7-2.5Z"
            />
            <path d="M9.3 12.1 11 13.8l3.8-4" /></svg
          ><span>Admin login</span></a
        >
        <button
          id="maintenanceThemeToggle"
          class="maintenance-action maintenance-theme-toggle"
          type="button"
          aria-label="Switch to dark theme"
        >
          <svg
            class="theme-icon theme-icon-moon"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              d="M20.3 15.3A8.5 8.5 0 0 1 8.7 3.7 8.5 8.5 0 1 0 20.3 15.3Z"
            /></svg
          ><svg
            class="theme-icon theme-icon-sun"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="3.5" />
            <path
              d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
            />
          </svg>
        </button>
      </nav>
    </header>

    <main class="maintenance-main">
      <section class="maintenance-shell" aria-labelledby="maintenanceTitle">
        <div class="maintenance-copy">
          <div class="maintenance-status">
            <span class="maintenance-status-dot" aria-hidden="true"></span
            >Maintenance in progress
          </div>
          <div class="headline-block headline-split">
            <span class="headline-lead">We&rsquo;re making things</span>
            <h1 id="maintenanceTitle">better.</h1>
            <p class="headline-apology">Sorry for the inconvenience.</p>
          </div>
          <p id="maintenanceDescription">
            BRACU Course Tracker is temporarily unavailable while we complete an
            update. Please check back shortly.
          </p>
          <div class="maintenance-meta">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12 3.5 19 6v5.2c0 4.4-2.8 7.7-7 9.3-4.2-1.6-7-4.9-7-9.3V6l7-2.5Z"
              />
              <path d="M9.3 12.1 11 13.8l3.8-4" /></svg
            ><span>Your saved academic data remains secure.</span>
          </div>
          <button id="maintenanceRetry" class="maintenance-retry" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 11a8 8 0 1 0-2.3 5.7" />
              <path d="M20 4v7h-7" /></svg
            >Check again
          </button>
        </div>
        <div class="maintenance-visual" aria-hidden="true">
          <span class="maintenance-orbit maintenance-orbit-one"></span
          ><span class="maintenance-orbit maintenance-orbit-two"></span
          ><img src="assets/maintenance-illustration.svg" alt="" />
        </div>
      </section>
    </main>

    <footer class="maintenance-legal" aria-label="Legal information">
      <a href="privacy.html">Privacy Policy</a><span aria-hidden="true">·</span
      ><a href="terms.html">Terms of Use</a>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/support-core.js"></script>
    <script src="js/motion.js"></script>
    <script src="js/maintenance-preview.js"></script>
    <script src="js/maintenance-guard.js"></script>
    <script src="js/support-widget.js"></script>
  </body>
</html>
